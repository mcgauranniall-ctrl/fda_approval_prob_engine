[project]
name = "fdaengine"
version = "0.1.0"
description = "FDA approval probability engine: programme-level approval forecasts at selectable milestone levels"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "jinja2>=3.1",
    "streamlit>=1.36",
]

[project.optional-dependencies]
# Offline research pipeline (P3-P5). Installed separately because PyMC/LightGBM are heavy.
research = [
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "pymc>=5.16",
    "arviz>=0.19",
    "lifelines>=0.29",
    "lightgbm>=4.4",
    "shap>=0.46",
    "duckdb>=1.0",
    "pyarrow>=16",
    "ijson>=3.3",
    "nutpie>=0.16.11",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
fdaengine-case = "fdaengine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fdaengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live public APIs (deselect with -m 'not network')"]

[tool.ruff]
line-length = 110
target-version = "py312"
